name: Nexus release preflight (packaging disabled)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-gates:
    runs-on: [self-hosted, nexus-release-trusted]
    environment: release-approval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python3 ci/check-pins.py --runtime
      - name: Verify protected externally provisioned evidence
        env:
          NEXUS_RELEASE_TRUST_POLICY: ${{ vars.NEXUS_RELEASE_TRUST_POLICY }}
          NEXUS_EVIDENCE_DIR: ${{ vars.NEXUS_EVIDENCE_DIR }}
        run: |
          test -n "$NEXUS_RELEASE_TRUST_POLICY"
          test -n "$NEXUS_EVIDENCE_DIR"
          bash scripts/release.sh --evidence "$NEXUS_EVIDENCE_DIR"
# No artifact upload, tag creation, release publishing or deployment permission.
